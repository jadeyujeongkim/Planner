<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
const { useState, useEffect, useRef, useMemo, useContext } = React;
const html = htm.bind(React.createElement);

const HH = 52; 
const DOW = ['일','월','화','수','목','금','토'];
const COLOR_NAMES = ['그린','옐로우','블루','핑크','퍼플','오렌지','민트','그레이'];
const DEFAULT_CATS = [
  { id: 'cat-study', name: '학업', color: 1 },
  { id: 'cat-leisure', name: '여가', color: 0 },
  { id: 'cat-work', name: '업무', color: 2 },
  { id: 'cat-health', name: '운동·건강', color: 6 },
  { id: 'cat-life', name: '생활', color: 3 }
];
const OLD_MAP = ['cat-leisure', 'cat-leisure', 'cat-health', 'cat-work', 'cat-study', 'cat-life'];
const CatCtx = React.createContext({ list: [], map: {} });
const cvar = (m, id) => 'var(--e' + ((m[id] || { color: 7 }).color) + ')';

function migrate(d) {
  const x = { ...d };
  delete x.presets; // 기존 프리셋 제거 반영
  if (!x.ddays) x.ddays = [];
  if (!x.favorites) x.favorites = [];
  if (!x.cats) x.cats = DEFAULT_CATS.map(c => ({ ...c }));
  const fix = o => (o.cat ? o : { ...o, cat: OLD_MAP[o.color] || 'cat-life' });
  x.events = (x.events || []).map(fix);
  x.todos = (x.todos || []).map(fix);
  return x;
}
const KEY = 'sage-planner-v1', PKEY = 'sage-planner-photo-v1', STAMP = 'sage-planner-stamp-v1';
const readStamp = () => { try { return Number(localStorage.getItem(STAMP)) || 0; } catch (e) { return 0; } };
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = (s || '').split('-').map(Number); return new Date(y || 2026, (m || 1) - 1, d || 1); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const addMonths = (d, n) => {
  const last = new Date(d.getFullYear(), d.getMonth() + n + 1, 0).getDate();
  return new Date(d.getFullYear(), d.getMonth() + n, Math.min(d.getDate(), last));
};
const mm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const uid = () => Math.random().toString(36).slice(2, 9);
const label = s => { const d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; };

function titleOf(view, sel) {
  const d = parse(sel);
  if (view === 'month') return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
  if (view === 'day') return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일';
  const s = addDays(d, -d.getDay()), e = addDays(s, 6);
  return s.getMonth() === e.getMonth()
    ? s.getFullYear() + '년 ' + (s.getMonth() + 1) + '월 ' + s.getDate() + '일 – ' + e.getDate() + '일'
    : (s.getMonth() + 1) + '월 ' + s.getDate() + '일 – ' + (e.getMonth() + 1) + '월 ' + e.getDate() + '일';
}

function layout(evs) {
  const s = [...evs].sort((a, b) => a.start - b.start || b.end - a.end);
  const out = []; let cluster = [], clusterEnd = -1, laneEnds = [];
  const flush = () => { cluster.forEach(c => { c.cols = laneEnds.length; }); out.push(...cluster); cluster = []; laneEnds = []; clusterEnd = -1; };
  for (const e of s) {
    if (cluster.length && e.start >= clusterEnd) flush();
    let lane = laneEnds.findIndex(x => x <= e.start);
    if (lane < 0) { lane = laneEnds.length; laneEnds.push(e.end); } else laneEnds[lane] = e.end;
    cluster.push({ e, lane, cols: 1 });
    clusterEnd = Math.max(clusterEnd, e.end);
  }
  flush();
  return out;
}

const ICONS = {

  plus: ['M5 12h14', 'M12 5v14'], x: ['M18 6 6 18', 'm6 6 12 12'], check: ['M20 6 9 17l-5-5'],

  book: ['M12 7v14', 'M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z'],
  flag: ['M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z', 'M4 22v-7'],

function Icon({ n, size = 16, sw = 1.8 }) {
  return html`<svg viewBox="0 0 24 24" width=${size} height=${size} fill="none" stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${ICONS[n].map((d, i) => html`<path key=${i} d=${d} />`)}</svg>`;

const DEFAULT_PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">' +
  '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2e6"/><stop offset="1" stop-color="#d3e0cc"/></linearGradient></defs>' +

function readImage(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      let side = 900, q = 0.78, out = '';
      for (let i = 0; i < 6; i++) {
        const sc = Math.min(1, side / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 200000) break;
        side = Math.round(side * 0.8); q = Math.max(0.5, q - 0.06);
      }
      cb(out);
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function seed() {
  const t = new Date(), d0 = fmt(t), d1 = fmt(addDays(t, 1)), dm = fmt(addDays(t, -1));
  const ev = (title, date, start, end, cat, repeat='none', endDate='') => ({ id: uid(), title, date, start, end, cat, repeat, endDate });
  return {
    caption: '천천히, 하지만 꾸준히',
    events: [
      ev('아침 스트레칭', d0, 420, 450, 'cat-health', 'daily'), 
      ev('팀 미팅', d0, 840, 900, 'cat-work'), 
      ev('기말고사 기간', d0, null, null, 'cat-study', 'none', fmt(addDays(t, 3)))
    ],
    favorites: [
      { id: uid(), title: '아침 루틴', start: 420, end: 480, cat: 'cat-health' },
      { id: uid(), title: '집중 공부', start: 540, end: 720, cat: 'cat-study' }
    ],
    ddays: [{ id: uid(), title: '기말고사', date: fmt(addDays(t, 14)) }],
    todos: [
      { id: uid(), date: d0, text: '수학 숙제하기', done: false, cat: 'cat-study', repeat: 'none' },
      { id: uid(), date: d0, text: '물 2L 마시기', done: false, cat: 'cat-health', repeat: 'daily' }
    ],
    journal: {}
  };
}

function load() {
  try { const r = localStorage.getItem(KEY); if (r) return migrate(Object.assign({ events: [], todos: [], journal: {}, caption: '', ddays: [], favorites: [] }, JSON.parse(r))); } catch (e) {}
  return null;
}

function Modal({ title, onClose, children }) {
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);
  const p = 'max(16px,env(safe-area-inset-';
  return html`
    <div className="fixed inset-0 z-50 flex items-center justify-center"
      style=${{ background: 'rgba(20,28,22,.45)', padding: p + 'top,0px)) ' + p + 'right,0px)) ' + p + 'bottom,0px)) ' + p + 'left,0px))' }}
      onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
      <div role="dialog" aria-modal="true" aria-label=${title}
        className="w-full max-w-md overflow-y-auto rounded-[24px] border border-line bg-card p-5 shadow-soft" style=${{ maxHeight: '100%' }}>
        <div className="mb-4 flex items-center justify-between">
          <h2 className="font-display text-xl">${title}</h2>
          <button type="button" className="icon-btn" onClick=${onClose} aria-label="닫기"><${Icon} n="x" /></button>
        </div>
        ${children}
      </div>
    </div>`;
}

/* 1분 단위 도르래/피커 스타일 시간 설정 컴포넌트 */
function TimePicker({ value, onChange, label: lb }) {
  // value는 분 (0 ~ 1440)
  const safeVal = value != null ? value : 540;
  const hour = Math.floor(safeVal / 60);
  const min = safeVal % 60;

  return html`
    <div className="flex items-center gap-2 rounded-xl bg-bg p-2 border border-line" aria-label=${lb}>
      <div className="flex items-center gap-1 flex-1 justify-center">
        <span className="text-xs text-muted">시</span>
        <select value=${hour} onChange=${e => onChange(Number(e.target.value) * 60 + min)} className="field py-1 px-2 text-center font-bold">
          ${Array.from({length: 24}, (_, i) => html`<option key=${i} value=${i}>${pad(i)}</option>`)}
        </select>
      </div>
      <span className="font-bold">:</span>
      <div className="flex items-center gap-1 flex-1 justify-center">
        <span className="text-xs text-muted">분 (1분단위)</span>
        <select value=${min} onChange=${e => onChange(hour * 60 + Number(e.target.value))} className="field py-1 px-2 text-center font-bold">
          ${Array.from({length: 60}, (_, i) => html`<option key=${i} value=${i}>${pad(i)}</option>`)}
        </select>
      </div>
    </div>
  `;
}

function Swatches({ value, onChange }) {
  return html`<div className="flex flex-wrap gap-2" role="radiogroup" aria-label="색상">${COLOR_NAMES.map((n, i) => html`
    <button key=${i} type="button" role="radio" aria-checked=${value === i} aria-label=${n} onClick=${() => onChange(i)}
      className="h-7 w-7 rounded-full" style=${{ background: 'var(--e' + i + ')', boxShadow: value === i ? '0 0 0 2px var(--card),0 0 0 4px var(--e' + i + ')' : 'none' }} />`)}</div>`;
}

function CatPick({ value, onChange }) {
  const { list } = useContext(CatCtx);
  return html`<div className="flex flex-wrap gap-2" role="radiogroup" aria-label="카테고리">${list.map(c => html`
    <button key=${c.id} type="button" role="radio" aria-checked=${value === c.id} onClick=${() => onChange(c.id)}

/* 일정 추가/수정 모달 (기간설정, 반복설정, 1분단위 도르래 시간피커 적용) */
function EventModal({ ev, favorites, onSave, onDelete, onClose }) {
  const [d, setD] = useState(ev);
  const [err, setErr] = useState('');
  const [cf, setCf] = useState(false);
  const timed = d.start != null;
  const set = p => setD(x => ({ ...x, ...p }));

  const applyFav = f => {
    set({ title: f.title, start: f.start, end: f.end, cat: f.cat });
  };

  const submit = e => {
    e.preventDefault();
    const title = d.title.trim();
    if (!title) { setErr('제목을 입력해 주세요.'); return; }
    onSave({ ...d, title });
  };

  return html`
    <${Modal} title=${ev.id ? '일정 수정' : '새 일정'} onClose=${onClose}>
      <form onSubmit=${submit} className="flex flex-col gap-4">
        ${favorites.length > 0 && html`
          <div>
            <label className="mb-1 block text-xs text-muted">즐겨찾기에서 가져오기</label>
            <div className="flex flex-wrap gap-1.5">
              ${favorites.map(f => html`<button key=${f.id} type="button" className="btn btn-soft text-xs py-1 px-2" onClick=${() => applyFav(f)}>${f.title}</button>`)}
            </div>
          </div>
        `}
        <div>
          <input autoFocus className="field" placeholder="무엇을 할까요?" aria-label="제목" value=${d.title} onChange=${e => { set({ title: e.target.value }); setErr(''); }} />
          ${err && html`<p className="mt-1 text-xs text-danger">${err}</p>`}
        </div>
        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="mb-1 block text-xs text-muted" htmlFor="ev-date">시작일</label>
            <input id="ev-date" type="date" className="field" value=${d.date} onChange=${e => e.target.value && set({ date: e.target.value })} />
          </div>
          <div>
            <label className="mb-1 block text-xs text-muted" htmlFor="ev-enddate">종료일 (기간 설정)</label>
            <input id="ev-enddate" type="date" className="field" value=${d.endDate || ''} onChange=${e => set({ endDate: e.target.value })} placeholder="선택사항" />
          </div>
        </div>
        <div>
          <div className="mb-1 text-xs text-muted">시간 설정 (1분 단위 정밀 조절)</div>
          <div className="mb-2 grid grid-cols-2 gap-1 rounded-xl bg-card2 p-1">
            <button type="button" onClick=${() => set({ start: 540, end: 600 })} className=${'rounded-lg py-1.5 text-sm ' + (timed ? 'bg-card font-medium shadow-soft' : 'text-muted')}>시간 지정</button>
            <button type="button" onClick=${() => set({ start: null, end: null })} className=${'rounded-lg py-1.5 text-sm ' + (!timed ? 'bg-card font-medium shadow-soft' : 'text-muted')}>시간 미설정</button>
          </div>
          ${timed && html`
            <div className="flex flex-col gap-2">
              <div>
                <span className="text-xs text-muted mb-1 block">시작 시간</span>
                <${TimeSelectComp} value=${d.start} onChange=${s => set({ start: s, end: Math.max(s + 15, d.end) })} />
              </div>
              <div>
                <span className="text-xs text-muted mb-1 block">종료 시간</span>
                <${TimeSelectComp} value=${d.end} onChange=${en => set({ end: Math.max((d.start || 0) + 1, en) })} />
              </div>
            </div>
          `}
        </div>
        <div>
          <label className="mb-1 block text-xs text-muted">반복 설정</label>
          <select value=${d.repeat || 'none'} onChange=${e => set({ repeat: e.target.value })} className="field">
            <option value="none">반복 없음</option>
            <option value="daily">매일 반복</option>
            <option value="weekly">매주 반복</option>
          </select>
        </div>
        <div><div className="mb-2 text-xs text-muted">카테고리</div><${CatPick} value=${d.cat} onChange=${c => set({ cat: c })} /></div>
        <div className="flex items-center justify-between gap-2 pt-1">
          <div>${ev.id && (cf
            ? html`<span className="flex items-center gap-2 text-sm"><button type="button" className="btn btn-danger" onClick=${() => onDelete(ev.id)}>정말 삭제</button><button type="button" className="btn" onClick=${() => setCf(false)}>취소</button></span>`
            : html`<button type="button" className="btn btn-danger" onClick=${() => setCf(true)}><${Icon} n="trash" size=${14} />삭제</button>`)}</div>
          ${!cf && html`<div className="flex gap-2"><button type="button" className="btn" onClick=${onClose}>취소</button><button type="submit" className="btn btn-primary">저장</button></div>`}
        </div>
      </form>
    <//>`;
}

  return html`
    <div className="flex items-center gap-2">
      <select value=${h} onChange=${e => onChange(Number(e.target.value) * 60 + m)} className="field">
        ${Array.from({length: 24}, (_, i) => html`<option key=${i} value=${i}>${pad(i)}시</option>`)}
      </select>
      <select value=${m} onChange=${e => onChange(h * 60 + Number(e.target.value))} className="field">
        ${Array.from({length: 60}, (_, i) => html`<option key=${i} value=${i}>${pad(i)}분</option>`)}
      </select>
    </div>
  `;
}

function MiniCal({ sel, onSelect, eventDates, today }) {
  const [m, setM] = useState(() => { const d = parse(sel); return new Date(d.getFullYear(), d.getMonth(), 1); });
  useEffect(() => {
    const d = parse(sel);
    setM(x => (x.getFullYear() === d.getFullYear() && x.getMonth() === d.getMonth()) ? x : new Date(d.getFullYear(), d.getMonth(), 1));
  }, [sel]);
  const lead = m.getDay();
  const dim = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = Array.from({ length: Math.ceil((lead + dim) / 7) * 7 }, (_, i) => addDays(m, i - lead));
  return html`
    <section className="order-4 hidden rounded-[28px] border border-line bg-card p-4 shadow-soft xl:block">
      <div className="mb-2 flex items-center justify-between">
        <span className="font-display text-base">${m.getFullYear()}년 ${m.getMonth() + 1}월</span>
        <span className="flex"><button type="button" className="icon-btn" aria-label="이전" onClick=${() => setM(addMonths(m, -1))}><${Icon} n="left" /></button><button type="button" className="icon-btn" aria-label="다음" onClick=${() => setM(addMonths(m, 1))}><${Icon} n="right" /></button></span>
      </div>
      <div className="grid grid-cols-7 text-center text-[11px] text-muted">${DOW.map((w, i) => html`<span key=${w} className=${'py-1 ' + (i === 0 ? 'text-danger' : '')}>${w}</span>`)}</div>
      <div className="grid grid-cols-7 gap-y-0.5">${cells.map(c => {
        const k = fmt(c), inM = c.getMonth() === m.getMonth(), isSel = k === sel, isToday = k === today;
        return html`<button key=${k} type="button" onClick=${() => onSelect(k)} aria-label=${label(k)} aria-pressed=${isSel}
          className=${'relative mx-auto grid h-8 w-8 place-items-center rounded-full text-xs tabular-nums ' + (isSel ? 'bg-accent font-medium text-onaccent' : inM ? 'hover:bg-card2' : 'text-muted opacity-50 hover:bg-card2')}
          style=${isToday && !isSel ? { boxShadow: 'inset 0 0 0 1.5px var(--accent)' } : null}>
          ${c.getDate()}${eventDates.has(k) && html`<span className="absolute bottom-0.5 h-1 w-1 rounded-full" style=${{ background: isSel ? 'var(--onaccent)' : 'var(--accent)' }} />`}
        </button>`;
      })}</div>
    </section>`;
}

function Chip({ e, onOpen, drag, onEnd }) {

    onClick=${() => onOpen(e)}
    onDragStart=${ev => { drag.current = { id: e.id, offset: 0, dur: 60 }; ev.dataTransfer.setData('text/plain', e.id); ev.dataTransfer.effectAllowed = 'move'; }}
    onDragEnd=${onEnd}>
    <span className="truncate">${e.title}</span></button>`;

/* 24시간 타임테이블 유지 */
function TimeGrid({ days, byDate, today, sel, setSel, openEv, openNew, drag, onDropTimed, onDropUntimed, patchEv, wide }) {
  const scroller = useRef(null);
  const { map } = useContext(CatCtx);
  const resizing = useRef(false);
  const [hover, setHover] = useState(null);
  const [barHover, setBarHover] = useState(null);
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 7 * HH; }, [days.length]);
  const cols = '3rem repeat(' + days.length + ',minmax(0,1fr))';
  const endDrag = () => { drag.current = null; setHover(null); setBarHover(null); };
  const calcStart = (e) => {
    const dr = drag.current; if (!dr) return null;
    const r = e.currentTarget.getBoundingClientRect();
    return Math.max(0, Math.min(1440 - dr.dur, Math.round(((e.clientY - r.top) / HH * 60 - dr.offset) / 5) * 5));
  };
  const startResize = (e, ev) => {
    e.stopPropagation(); e.preventDefault();
    resizing.current = true;
    const y0 = e.clientY, end0 = ev.end; let lastEnd = ev.end;
    const move = m => {
      const ne = Math.max(ev.start + 15, Math.min(1440, end0 + Math.round((m.clientY - y0) / HH * 60)));
      if (ne !== lastEnd) { lastEnd = ne; patchEv(ev.id, { end: ne }); }
    };
    const up = () => { resizing.current = false; window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  const nowMin = now.getHours() * 60 + now.getMinutes();

  return html`
    <div className="overflow-x-auto"><div style=${{ minWidth: wide ? 620 : 0 }}>
      <div ref=${scroller} className="overflow-y-auto rounded-2xl border border-line" style=${{ maxHeight: 'min(70vh,660px)' }}>
        <div className="sticky top-0 z-20 bg-card">
          <div className="grid border-b border-line" style=${{ gridTemplateColumns: cols }}>
            <div />
            ${days.map(d => {
              const dd = parse(d), isT = d === today, isS = d === sel;
              return html`<button key=${d} type="button" onClick=${() => setSel(d)} className=${'flex flex-col items-center gap-0.5 border-l border-line py-2 ' + (isS ? 'bg-accent-soft' : 'hover:bg-card2')}>
                <span className=${'text-[11px] ' + (dd.getDay() === 0 ? 'text-danger' : 'text-muted')}>${DOW[dd.getDay()]}</span>
                <span className=${'grid h-7 min-w-7 place-items-center rounded-full px-1 text-sm font-medium tabular-nums ' + (isT ? 'bg-accent text-onaccent' : '')}>${dd.getDate()}</span>
              </button>`;
            })}
          </div>
          <div className="grid border-b border-line bg-card2" style=${{ gridTemplateColumns: cols }}>
            <div className="flex flex-col items-center justify-center gap-1 px-1 text-[10px] text-muted"><${Icon} n="inbox" size=${15} />대기</div>
            ${days.map(d => {
              const list = (byDate[d] || []).filter(e => e.start == null);
              return html`<div key=${d} className="flex max-h-[120px] min-h-[52px] flex-wrap content-start gap-1.5 overflow-y-auto border-l border-line p-1.5 transition-colors"
                style=${{ background: barHover === d ? 'var(--accent-soft)' : 'transparent' }}
                onDragOver=${e => { if (!drag.current) return; e.preventDefault(); setBarHover(d); }}
                onDragLeave=${e => { if (!e.currentTarget.contains(e.relatedTarget)) setBarHover(null); }}
                onDrop=${e => { e.preventDefault(); onDropUntimed(d); endDrag(); }}>
                ${list.map(e => html`<${Chip} key=${e.id} e=${e} onOpen=${openEv} drag=${drag} onEnd=${endDrag} />`)}
                <button type="button" className="icon-btn" style=${{ width: 24, height: 24 }} onClick=${() => openNew({ date: d, start: null })}><${Icon} n="plus" size=${14} /></button>
              </div>`;
            })}
          </div>
        </div>
        <div className="grid" style=${{ gridTemplateColumns: cols, paddingTop: 10, paddingBottom: 10 }}>
          <div className="relative" style=${{ height: 24 * HH }}>
            ${Array.from({ length: 25 }, (_, i) => html`<span key=${i} className="absolute right-2 -translate-y-1/2 text-[10px] tabular-nums text-muted" style=${{ top: i * HH }}>${pad(i)}:00</span>`)}
          </div>
          ${days.map(d => {
            const laid = layout((byDate[d] || []).filter(e => e.start != null));
            return html`<div key=${d} className="relative border-l border-line"
              style=${{ height: 24 * HH, backgroundImage: 'linear-gradient(var(--line) 1px,transparent 1px)', backgroundSize: '100% ' + HH + 'px', borderBottom: '1px solid var(--line)' }}
              onClick=${e => { if (e.target !== e.currentTarget) return; const y = e.clientY - e.currentTarget.getBoundingClientRect().top; openNew({ date: d, start: Math.min(1380, Math.floor(y / HH) * 60) }); }}
              onDragOver=${e => {
                if (!drag.current) return; e.preventDefault();
                const s = calcStart(e);
                setHover(h => (h && h.date === d && h.start === s) ? h : { date: d, start: s, dur: drag.current ? drag.current.dur : 60 });
              }}
              onDragLeave=${e => { if (!e.currentTarget.contains(e.relatedTarget)) setHover(null); }}
              onDrop=${e => { e.preventDefault(); const s = calcStart(e); if (s != null) onDropTimed(d, s); endDrag(); }}>
              ${d === today && html`<div className="pointer-events-none absolute inset-x-0 z-10 h-px bg-accent" style=${{ top: nowMin / 60 * HH }}><span className="absolute -left-1 -top-[3px] h-[7px] w-[7px] rounded-full bg-accent" /></div>`}
              ${hover && hover.date === d && html`<div className="pointer-events-none absolute inset-x-1 z-10 rounded-lg border-2 border-dashed px-1.5 py-0.5 text-[10px] font-medium tabular-nums"
                style=${{ top: hover.start / 60 * HH, height: hover.dur / 60 * HH, borderColor: 'var(--accent)', background: 'var(--accent-soft)', color: 'var(--accent-strong)' }}>${mm(hover.start)} – ${mm(hover.start + hover.dur)}</div>`}
              ${laid.map(({ e, lane, cols: c }) => {
                const h = Math.max(18, (e.end - e.start) / 60 * HH - 2), w = 100 / c;
                return html`<div key=${e.id} role="button" tabIndex="0" draggable="true" className="ev group absolute cursor-grab overflow-hidden rounded-lg px-2 py-1 active:cursor-grabbing"
                  style=${{ top: e.start / 60 * HH + 1, height: h, left: 'calc(' + (lane * w) + '% + 2px)', width: 'calc(' + w + '% - 4px)', '--c': cvar(map, e.cat), zIndex: 5 }}
                  onClick=${ev => { ev.stopPropagation(); openEv(e); }}
                  onKeyDown=${ev => { if (ev.key === 'Enter') openEv(e); }}
                  onDragStart=${ev => {
                    if (resizing.current) { ev.preventDefault(); return; }
                    const r = ev.currentTarget.getBoundingClientRect(), dur = e.end - e.start;
                    drag.current = { id: e.id, offset: Math.max(0, Math.min(dur - 15, (ev.clientY - r.top) / HH * 60)), dur };
                    ev.dataTransfer.setData('text/plain', e.id); ev.dataTransfer.effectAllowed = 'move';
                  }}
                  onDragEnd=${endDrag}>
                  <div className="truncate text-[12px] font-medium leading-tight">${e.title}</div>
                  ${h >= 34 && html`<div className="text-[10.5px] tabular-nums text-muted">${mm(e.start)} – ${mm(e.end)}</div>`}
                  <div className="absolute inset-x-0 bottom-0 h-2.5 cursor-ns-resize" style=${{ touchAction: 'none' }} onPointerDown=${ev => startResize(ev, e)} aria-hidden="true">
                    <span className="mx-auto mt-1 block h-[3px] w-6 rounded-full opacity-60" style=${{ background: 'var(--c)' }} />
                  </div>
                </div>`;
              })}
            </div>`;
          })}
        </div>
      </div>
    </div></div>`;
}

function MonthView({ sel, setSel, setView, byDate, today, openEv, openNew, drag, onDropDate }) {
  const [over, setOver] = useState(null);
  const { map } = useContext(CatCtx);
  const d = parse(sel);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const lead = first.getDay();
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const cells = Array.from({ length: Math.ceil((lead + dim) / 7) * 7 }, (_, i) => addDays(first, i - lead));
  const endDrag = () => { drag.current = null; setOver(null); };

  return html`
    <div className="overflow-hidden rounded-2xl border border-line">
      <div className="grid grid-cols-7 bg-card2 text-center text-[11px]">${DOW.map((w, i) => html`<div key=${w} className=${'py-2 ' + (i === 0 ? 'text-danger' : 'text-muted')}>${w}</div>`)}</div>
      <div className="grid grid-cols-7">
        ${cells.map(c => {
          const k = fmt(c), inM = c.getMonth() === d.getMonth(), isT = k === today, isS = k === sel;
          const list = [...(byDate[k] || [])].sort((a, b) => (a.start == null ? 2000 : a.start) - (b.start == null ? 2000 : b.start));
          return html`<div key=${k} className="group min-h-[64px] cursor-pointer border-l border-t border-line p-1 sm:min-h-[108px] sm:p-1.5"
            style=${{ background: over === k ? 'var(--accent-soft)' : inM ? 'transparent' : 'var(--card2)', boxShadow: isS ? 'inset 0 0 0 2px var(--accent)' : 'none' }}
            onClick=${() => setSel(k)} onDoubleClick=${() => { setSel(k); setView('day'); }}
            onDragOver=${e => { if (!drag.current) return; e.preventDefault(); setOver(k); }}
            onDragLeave=${e => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }}
            onDrop=${e => { e.preventDefault(); onDropDate(k); endDrag(); }}>
            <div className="mb-1 flex items-center justify-between">
              <button type="button" onClick=${e => { e.stopPropagation(); setSel(k); setView('day'); }}
                className=${'grid h-6 min-w-6 place-items-center rounded-full px-1 text-xs tabular-nums ' + (isT ? 'bg-accent font-medium text-onaccent' : inM ? '' : 'text-muted')}>${c.getDate()}</button>
              <button type="button" className="icon-btn hidden opacity-0 group-hover:opacity-100 focus:opacity-100 sm:inline-grid" style=${{ width: 22, height: 22 }} onClick=${e => { e.stopPropagation(); openNew({ date: k, start: null }); }}><${Icon} n="plus" size=${13} /></button>
            </div>
            <div className="hidden flex-col gap-1 sm:flex">
              ${list.slice(0, 3).map(e => html`<button key=${e.id} type="button" draggable="true" className=${'mchip' + (e.start == null ? ' untimed' : '')} style=${{ '--c': cvar(map, e.cat) }}
                onClick=${ev => { ev.stopPropagation(); openEv(e); }}
                onDragStart=${ev => { drag.current = { id: e.id, offset: 0, dur: 60 }; ev.dataTransfer.setData('text/plain', e.id); ev.dataTransfer.effectAllowed = 'move'; }}
                onDragEnd=${endDrag}>
                ${e.start != null && html`<span className="tabular-nums text-muted">${mm(e.start)}</span>`}<span className="truncate">${e.title} ${e.endDate ? '(~'+e.endDate.slice(5)+')' : ''}</span></button>`)}
            </div>
          </div>`;
        })}
      </div>
    </div>`;
}

function Check({ on, onClick, text, now }) {
  return html`<button type="button" onClick=${onClick} aria-pressed=${on} aria-label=${text + (on ? ' 완료 취소' : ' 완료')} className=${'check ' + (on ? 'on' : '') + (now ? ' now' : '')}>${on && html`<${Icon} n="check" size=${12} sw=${3} />`}</button>`;
}

function Todos({ date, todos, setTodos, favorites }) {
  const { list: cats, map } = useContext(CatCtx);
  const [cat, setCat] = useState(cats[0]?.id || 'cat-study');
  const [t, setT] = useState('');
  const [repeat, setRepeat] = useState('none');
  const list = todos.filter(x => x.date === date);
  const done = list.filter(x => x.done).length;

  const add = e => { e.preventDefault(); const v = t.trim(); if (!v) return; setTodos(a => [...a, { id: uid(), date, text: v, done: false, cat, repeat }]); setT(''); };

  return html`
    <div>
      <div className="mb-3 flex items-baseline justify-between"><h3 className="font-display text-base">${label(date)} 할 일</h3><span className="text-xs tabular-nums text-muted">${done}/${list.length} 완료</span></div>
      <form onSubmit=${add} className="mb-3 flex flex-col gap-2">
        <div className="flex gap-2">
          <input className="field" placeholder="할 일 입력" value=${t} onChange=${e => setT(e.target.value)} />
          <button type="submit" className="btn btn-primary" aria-label="추가"><${Icon} n="plus" size=${16} /></button>
        </div>
        <${CatPick} value=${cat} onChange=${setCat} />
        <div className="flex items-center gap-2">
          <span className="text-xs text-muted">반복:</span>
          <select value=${repeat} onChange=${e => setRepeat(e.target.value)} className="field text-xs py-1">
            <option value="none">없음</option>
            <option value="daily">매일</option>
            <option value="weekly">매주</option>
          </select>
        </div>
      </form>
      <ul className="flex flex-col gap-1">
        ${list.length === 0 && html`<li className="rounded-2xl border border-dashed border-line p-3 text-xs text-muted">할 일이 없어요.</li>`}
        ${list.map(x => html`<li key=${x.id} className="flex items-center gap-2.5 rounded-xl px-1 py-1.5 hover:bg-card2">
          <${Check} on=${x.done} text=${x.text} onClick=${() => setTodos(a => a.map(y => y.id === x.id ? { ...y, done: !y.done } : y))} />
          <span className=${'flex-1 text-sm ' + (x.done ? 'text-muted line-through' : '')}>${x.text} ${x.repeat !== 'none' ? '(' + (x.repeat === 'daily' ? '매일' : '매주') + ')' : ''}</span>
          <button type="button" className="icon-btn" style=${{ width: 26, height: 26 }} onClick=${() => setTodos(a => a.filter(y => y.id !== x.id))}><${Icon} n="x" size=${14} /></button>
        </li>`)}
      </ul>
    </div>`;
}

function Journal({ date, text, onChange }) {
  const [flash, setFlash] = useState(false);
  const tm = useRef(null);
  const change = v => { onChange(v); setFlash(true); clearTimeout(tm.current); tm.current = setTimeout(() => setFlash(false), 1200); };
  return html`
    <div>
      <div className="mb-3 flex items-baseline justify-between"><h3 className="font-display text-base">${label(date)}의 기록</h3><span className="text-xs text-muted">${flash ? '저장됨' : '자동 저장'}</span></div>
      <textarea className="field lined" rows="10" placeholder="오늘 하루는 어땠나요?" value=${text} onChange=${e => change(e.target.value)} style=${{ resize: 'vertical', padding: '4px 14px' }} />
    </div>`;
}

const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const ddText = n => n === 0 ? 'D-Day' : n > 0 ? 'D-' + n : 'D+' + (-n);

function Clock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 15000); return () => clearInterval(t); }, []);
  const h = now.getHours(), ap = h < 12 ? '오전' : '오후', h12 = h % 12 || 12;
  return html`
    <div className="flex flex-wrap items-baseline gap-x-3 gap-y-0.5">
      <h1 className="font-display text-xl leading-tight sm:text-2xl">${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${DOW[now.getDay()]}요일</h1>
      <span className="text-lg tabular-nums text-accent-strong sm:text-xl">${ap} ${h12}:${pad(now.getMinutes())}</span>
    </div>`;
}

function DdayBar({ items, today, onEdit }) {
  const up = items.map(d => ({ ...d, n: diffDays(today, d.date) })).filter(d => d.n >= 0).sort((a, b) => a.n - b.n).slice(0, 3);
  return html`
    <div className="flex flex-wrap items-center gap-2">
      ${up.map(d => html`<button key=${d.id} type="button" onClick=${onEdit} className="inline-flex items-center gap-2 rounded-full border border-line bg-card px-3 py-1.5 text-sm shadow-soft">
        <span className="max-w-[9rem] truncate">${d.title}</span><b className="font-medium tabular-nums text-accent-strong">${ddText(d.n)}</b></button>`)}
      <button type="button" className="btn" onClick=${onEdit}><${Icon} n="plus" size=${14} />D-day</button>
    </div>`;
}

function DdayModal({ items, setItems, today, onClose }) {
  const upd = (id, p) => setItems(items.map(x => x.id === id ? { ...x, ...p } : x));
  const add = () => setItems([...items, { id: uid(), title: '', date: today }]);
  const finish = () => { setItems(items.filter(x => x.title.trim())); onClose(); };
  return html`
    <${Modal} title="D-day 관리" onClose=${finish}>
      <div className="flex flex-col gap-3">
        ${items.map(x => {
          const n = diffDays(today, x.date);
          return html`<div key=${x.id} className="rounded-2xl border border-line bg-bg p-3">
            <div className="flex items-center gap-2">
              <input className="field" placeholder="이름" value=${x.title} onChange=${e => upd(x.id, { title: e.target.value })} />
              <button type="button" className="icon-btn" onClick=${() => setItems(items.filter(y => y.id !== x.id))}><${Icon} n="trash" size=${15} /></button>
            </div>
            <div className="mt-2 flex items-center gap-2">
              <input type="date" className="field" value=${x.date} onChange=${e => e.target.value && upd(x.id, { date: e.target.value })} />
              <span className="w-16 flex-none text-right font-medium tabular-nums text-accent-strong">${ddText(n)}</span>
            </div>
          </div>`;
        })}
      </div>
      <div className="mt-4 flex items-center justify-between">
        <button type="button" className="btn" onClick=${add}><${Icon} n="plus" size=${14} />추가</button>
        <button type="button" className="btn btn-primary" onClick=${finish}>완료</button>
      </div>
    <//>`;
}

/* 메인 앱 컴포넌트 */
function App() {
  const [data, setData] = useState(() => load() || migrate(seed()));
  const [photo, setPhoto] = useState(() => { try { return localStorage.getItem(PKEY); } catch (e) { return null; } });
  const [sel, setSel] = useState(() => fmt(new Date()));
  const [view, setView] = useState('week');
  const [modal, setModal] = useState(null);
  const [tab, setTab] = useState('todo');
  const [toast, setToast] = useState(null);
  const [qa, setQa] = useState('');
  const [catModal, setCatModal] = useState(false);
  const [ddModal, setDdModal] = useState(false);

  const drag = useRef(null);
  const toastT = useRef(null);
  const today = fmt(new Date());

  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }, [data]);
  const say = m => { setToast(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(null), 2400); };

  const setKey = k => fn => setData(d => ({ ...d, [k]: typeof fn === 'function' ? fn(d[k]) : fn }));
  const setTodos = setKey('todos');
  const setFavorites = setKey('favorites');
  const patchEv = (id, p) => setData(d => ({ ...d, events: d.events.map(e => e.id === id ? { ...e, ...(typeof p === 'function' ? p(e) : p) } : e) }));

  // 기간(Range) 일정을 고려하여 각 날짜별 이벤트 매핑 확장
  const byDate = useMemo(() => { 
    const m = {}; 
    data.events.forEach(e => { 
      (m[e.date] = m[e.date] || []).push(e);
      if (e.endDate && e.endDate > e.date) {
        let cur = parse(e.date);
        const endD = parse(e.endDate);
        while (true) {
          cur = addDays(cur, 1);
          if (cur > endD) break;
          const k = fmt(cur);
          (m[k] = m[k] || []).push({ ...e, isRangeSub: true });
        }
      }
    }); 
    return m; 
  }, [data.events]);

  const eventDates = useMemo(() => new Set(data.events.map(e => e.date)), [data.events]);
  const ctx = useMemo(() => ({ list: data.cats, map: Object.fromEntries(data.cats.map(c => [c.id, c])) }), [data.cats]);
  const defCat = data.cats[0] ? data.cats[0].id : '';

  const deleteCat = id => setData(d => {
    const rest = d.cats.filter(c => c.id !== id);
    if (!rest.length) return d;
    const fb = rest[0].id, fx = o => o.cat === id ? { ...o, cat: fb } : o;
    return { ...d, cats: rest, events: d.events.map(fx), todos: d.todos.map(fx) };
  });

  const openEv = e => setModal({ key: e.id, ev: e });
  const openNew = ({ date, start }) => setModal({ key: 'new' + uid(), ev: { id: null, title: '', date, endDate: '', start, end: start == null ? null : Math.min(1440, start + 60), cat: defCat, repeat: 'none' } });
  
  const saveEvent = ev => {
    if (ev.id) patchEv(ev.id, ev);
    else setData(d => ({ ...d, events: [...d.events, { ...ev, id: uid() }] }));
    setModal(null);
  };
  const deleteEvent = id => { setData(d => ({ ...d, events: d.events.filter(e => e.id !== id) })); setModal(null); say('일정을 삭제했어요'); };

  const onDropTimed = (date, start) => {
    const id = drag.current && drag.current.id; if (!id) return;
    patchEv(id, e => { const dur = e.start == null ? 60 : e.end - e.start; const s = Math.max(0, Math.min(1440 - dur, start)); return { date, start: s, end: s + dur }; });
    setSel(date); say(mm(start) + '에 배치했어요');
  };
  const onDropUntimed = date => { const id = drag.current && drag.current.id; if (id) patchEv(id, { date, start: null, end: null }); };
  const onDropDate = date => { const id = drag.current && drag.current.id; if (id) patchEv(id, { date }); };

  const quickAdd = e => {
    e.preventDefault(); const v = qa.trim(); if (!v) return;
    setData(d => ({ ...d, events: [...d.events, { id: uid(), title: v, date: sel, endDate: '', start: null, end: null, cat: defCat, repeat: 'none' }] }));
    setQa(''); if (view === 'month') say('대기 영역에 추가했어요');
  };

  const pickPhoto = f => readImage(f, url => {
    setPhoto(url);
    try { localStorage.setItem(PKEY, url); } catch (e) {}
  });
  const resetPhoto = () => { setPhoto(null); try { localStorage.removeItem(PKEY); } catch (e) {} };

  const shift = dir => { const d = parse(sel); setSel(fmt(view === 'month' ? addMonths(d, dir) : addDays(d, view === 'week' ? 7 * dir : dir))); };
  const days = view === 'day' ? [sel] : (() => { const s = addDays(parse(sel), -parse(sel).getDay()); return Array.from({ length: 7 }, (_, i) => fmt(addDays(s, i))); })();
  const dayTimed = (byDate[sel] || []).filter(e => e.start != null).sort((a, b) => a.start - b.start);

  return html`
  <${CatCtx.Provider} value=${ctx}>
  <div className="mx-auto max-w-[1500px]">
    <header className="mb-5 flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
      <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
        <span className="grid h-10 w-10 flex-none place-items-center rounded-2xl bg-accent-soft text-accent-strong"><${Icon} n="leaf" size=${20} /></span>
        <${Clock} />
        <${DdayBar} items=${data.ddays || []} today=${today} onEdit=${() => setDdModal(true)} />
      </div>
    </header>

    <div className="flex flex-col gap-5 xl:grid xl:grid-cols-[16rem_minmax(0,1fr)_20rem] xl:items-start">
      <aside className="contents xl:flex xl:flex-col xl:gap-5">
        <${PhotoWidget} photo=${photo} onPick=${pickPhoto} onReset=${resetPhoto} caption=${data.caption} onCaption=${v => setData(d => ({ ...d, caption: v }))} today=${today} />
        <${MiniCal} sel=${sel} onSelect=${setSel} eventDates=${eventDates} today=${today} />
        <${FavoritesPanel} favorites=${data.favorites || []} setFavorites=${setFavorites} />
        <${CatsPanel} onEdit=${() => setCatModal(true)} />
      </aside>

      <main className="order-2 min-w-0 rounded-[28px] border border-line bg-card p-3 shadow-soft sm:p-4">
        <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div className="flex items-center gap-1">
            <button type="button" className="icon-btn" aria-label="이전" onClick=${() => shift(-1)}><${Icon} n="left" size=${18} /></button>
            <button type="button" className="btn" onClick=${() => setSel(today)}>오늘</button>
            <button type="button" className="icon-btn" aria-label="다음" onClick=${() => shift(1)}><${Icon} n="right" size=${18} /></button>
            <h2 className="ml-2 font-display text-lg tabular-nums sm:text-xl">${titleOf(view, sel)}</h2>
          </div>
          <div className="grid grid-cols-3 gap-1 rounded-xl bg-card2 p-1" role="tablist">
            ${[['month', '월'], ['week', '주'], ['day', '일']].map(([k, n]) => html`<button key=${k} type="button" role="tab" aria-selected=${view === k} onClick=${() => setView(k)} className=${'rounded-lg px-4 py-1.5 text-sm ' + (view === k ? 'bg-card font-medium shadow-soft' : 'text-muted hover:text-ink')}>${n}</button>`)}
          </div>
        </div>
        <form onSubmit=${quickAdd} className="mb-3 flex gap-2">
          <input className="field" placeholder=${label(sel) + ' · 빠르게 일정 추가 (Enter)'} value=${qa} onChange=${e => setQa(e.target.value)} />
          <button type="button" className="btn btn-primary flex-none" onClick=${() => openNew({ date: sel, start: view === 'month' ? null : 540 })}><${Icon} n="plus" size=${15} />일정</button>
        </form>
        ${view === 'month'
          ? html`<${MonthView} sel=${sel} setSel=${setSel} setView=${setView} byDate=${byDate} today=${today} openEv=${openEv} openNew=${openNew} drag=${drag} onDropDate=${onDropDate} />`
          : html`<${TimeGrid} key=${view} days=${days} byDate=${byDate} today=${today} sel=${sel} setSel=${setSel} openEv=${openEv} openNew=${openNew} drag=${drag} onDropTimed=${onDropTimed} onDropUntimed=${onDropUntimed} patchEv=${patchEv} wide=${view === 'week'} />`}
      </main>

      <section className="order-3 rounded-[28px] border border-line bg-card p-4 shadow-soft">
        <div className="mb-4 grid grid-cols-2 gap-1 rounded-xl bg-card2 p-1" role="tablist">
          ${[['todo', 'list', '할 일'], ['journal', 'book', '일기']].map(([k, ic, n]) => html`<button key=${k} type="button" role="tab" aria-selected=${tab === k} onClick=${() => setTab(k)} className=${'flex items-center justify-center gap-1.5 rounded-lg py-1.5 text-sm ' + (tab === k ? 'bg-card font-medium shadow-soft' : 'text-muted hover:text-ink')}><${Icon} n=${ic} size=${14} />${n}</button>`)}
        </div>
        <div className="xl:max-h-[calc(100vh-9rem)] xl:overflow-y-auto">
          ${tab === 'todo' && html`<${Todos} date=${sel} todos=${data.todos} setTodos=${setTodos} favorites=${data.favorites || []} />`}
          ${tab === 'journal' && html`<${Journal} date=${sel} text=${data.journal[sel] || ''} onChange=${v => setData(d => ({ ...d, journal: { ...d.journal, [sel]: v } }))} />`}
        </div>
      </section>
    </div>

    ${modal && html`<${EventModal} key=${modal.key} ev=${modal.ev} favorites=${data.favorites || []} onSave=${saveEvent} onDelete=${deleteEvent} onClose=${() => setModal(null)} />`}
    ${catModal && html`<${CatModal} cats=${data.cats} setCats=${v => setData(d => ({ ...d, cats: v }))} onDelete=${deleteCat} onClose=${() => setCatModal(false)} />`}
    ${ddModal && html`<${DdayModal} items=${data.ddays || []} setItems=${v => setData(d => ({ ...d, ddays: v }))} today=${today} onClose=${() => setDdModal(false)} />`}
    ${toast && html`<div role="status" className="fixed left-1/2 z-[60] max-w-[90vw] -translate-x-1/2 rounded-full px-4 py-2 text-sm shadow-soft" style=${{ bottom: 'calc(16px + env(safe-area-inset-bottom,0px))', background: 'var(--ink)', color: 'var(--bg)' }}>${toast}</div>`}
  </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
